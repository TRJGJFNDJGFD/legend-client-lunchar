[package]
name = "legend-core"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic core logic for Legend Client Launcher (java detection, profiles, process launch) - no GUI dependency, so it's testable anywhere."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
which = "6"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
keyring = "3"
thiserror = "2"
sha1 = "0.10"
hex = "0.4"
